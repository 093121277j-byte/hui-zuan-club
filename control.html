<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUI ZUAN｜一体式控制台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:"Microsoft YaHei",Arial,sans-serif}.top{position:sticky;top:0;z-index:99;padding:16px 20px;background:rgba(8,11,18,.97);border-bottom:1px solid #303744}.brand{letter-spacing:6px;font-weight:800}.modes,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700}.modes .mode-btn{background:#fff!important;color:#05070a!important;border:1px solid #fff!important}.tabs .control-btn{background:#c5c9cf!important;color:#080a0d!important;border:1px solid #e1e4e8!important}.tabs .position-btn{background:#f2cf57!important;color:#090909!important;border:1px solid #f7dc78!important}.tabs .monitor-btn{background:#1769d2!important;color:#fff!important;border:1px solid #4388df!important}.modes .mode-btn.active,.tabs .control-btn.active,.tabs .monitor-btn.active{outline:3px solid rgba(255,255,255,.72);outline-offset:2px;box-shadow:0 0 18px rgba(255,255,255,.18)}.monitor-state{display:inline-flex;align-items:center;padding:9px 12px;border-radius:10px;background:#0c1420;border:1px solid #294b75;color:#8fc2ff;font-size:13px;font-weight:700}.monitor-state.running{background:#0d2c4e;color:#fff;border-color:#2787ef}.frame{width:100%;height:calc(100vh - 128px);border:0;display:none}.frame.show{display:block}</style></head><body><div class="top"><div class="brand">HUI ZUAN · UNIFIED CONTROL</div><div class="modes"><button class="mode-btn" id="mWait" onclick="setMode('waiting')">🌙 待机</button><button class="mode-btn" id="mSong" onclick="setMode('song')">🎵 点歌</button><button class="mode-btn" id="mGallery" onclick="setMode('gallery')">💎 展馆</button></div><div class="tabs"><button class="control-btn" id="tSong" onclick="tab('song')">点歌控制</button><button class="control-btn" id="tGallery" onclick="tab('gallery')">展馆控制</button><button class="position-btn" onclick="openPositions()">🪑 修改站位</button><button class="monitor-btn" id="tGift" onclick="tab('gift')">自动送礼监测</button><span class="monitor-state" id="monitorState">○ 送礼监测未启动</span></div></div><iframe id="song" class="frame show" src="song-control.html"></iframe><iframe id="gallery" class="frame" src="gallery-control.html"></iframe><iframe id="gift" class="frame" src="gift-listener.html" allow="display-capture"></iframe><script>
const db=supabase.createClient("https://ossaeaswzzfrekguefkh.supabase.co","sb_publishable_xxEoSgJZGaNrLmJnr1gtng_Xoxnd_Nn");
function paint(){const m=localStorage.getItem('huizuan_unified_mode')||'waiting';['Wait','Song','Gallery'].forEach(x=>document.getElementById('m'+x).classList.remove('active'));document.getElementById(m==='waiting'?'mWait':m==='gallery'?'mGallery':'mSong').classList.add('active')}
async function setMode(mode){localStorage.setItem('huizuan_unified_mode',mode);if(mode==='waiting'){try{let d=JSON.parse(localStorage.getItem('huizuanData')||'{}');d.mode='waiting';d.eventId=Date.now();localStorage.setItem('huizuanData',JSON.stringify(d))}catch(e){}}paint();try{await db.rpc('push_screen_event',{p_host_id:null,p_gallery_id:null,p_gallery_item_id:null,p_sister_id:null,p_event_type:'unified_'+mode,p_message:'一体式投屏切换：'+mode})}catch(e){console.warn('远程模式写入失败',e)}}
function tab(x){document.getElementById('song').classList.toggle('show',x==='song');document.getElementById('gallery').classList.toggle('show',x==='gallery');document.getElementById('gift').classList.toggle('show',x==='gift');document.getElementById('tSong').classList.toggle('active',x==='song');document.getElementById('tGallery').classList.toggle('active',x==='gallery');document.getElementById('tGift').classList.toggle('active',x==='gift')}
window.addEventListener('storage',e=>{paint()});paint();tab('song');function openPositions(){window.open('positions.html','huizuan_positions','width=760,height=900,resizable=yes,scrollbars=yes')}
function updateMonitorState(){try{const w=document.getElementById('gift').contentWindow;if(!w)return;const running=!!w.__HUIZUAN_MONITOR_RUNNING__;const el=document.getElementById('monitorState');el.textContent=running?'● 送礼监测运行中':'○ 送礼监测未启动';el.classList.toggle('running',running)}catch(e){}}setInterval(updateMonitorState,800);</script></body></html>
