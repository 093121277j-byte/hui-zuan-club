<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUI ZUAN｜一体式控制台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:"Microsoft YaHei",Arial,sans-serif}.top{position:sticky;top:0;z-index:99;padding:16px 20px;background:rgba(8,11,18,.97);border-bottom:1px solid #303744}.brand{letter-spacing:6px;font-weight:800}.modes,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 15px;border:1px solid #39414e;border-radius:10px;background:#141b27;color:#fff;cursor:pointer}.active{border-color:#e6edf7;box-shadow:0 0 16px rgba(230,240,255,.18)}.frame{width:100%;height:calc(100vh - 128px);border:0;display:none}.frame.show{display:block}.position-btn{border-color:#8c96a8;background:linear-gradient(180deg,#202938,#111722);font-weight:700}</style></head><body><div class="top"><div class="brand">HUI ZUAN · UNIFIED CONTROL</div><div class="modes"><button id="mWait" onclick="setMode('waiting')">🌙 待机</button><button id="mSong" onclick="setMode('song')">🎵 点歌</button><button id="mGallery" onclick="setMode('gallery')">💎 展馆</button></div><div class="tabs"><button id="tSong" onclick="tab('song')">点歌控制</button><button id="tGallery" onclick="tab('gallery')">展馆控制</button><button class="position-btn" onclick="openPositions()">🪑 修改站位</button></div></div><iframe id="song" class="frame show" src="song-control.html"></iframe><iframe id="gallery" class="frame" src="gallery-control.html"></iframe><script>
const db=supabase.createClient("https://ossaeaswzzfrekguefkh.supabase.co","sb_publishable_xxEoSgJZGaNrLmJnr1gtng_Xoxnd_Nn");
function paint(){const m=localStorage.getItem('huizuan_unified_mode')||'waiting';['Wait','Song','Gallery'].forEach(x=>document.getElementById('m'+x).classList.remove('active'));document.getElementById(m==='waiting'?'mWait':m==='gallery'?'mGallery':'mSong').classList.add('active')}
async function setMode(mode){localStorage.setItem('huizuan_unified_mode',mode);if(mode==='waiting'){try{let d=JSON.parse(localStorage.getItem('huizuanData')||'{}');d.mode='waiting';d.eventId=Date.now();localStorage.setItem('huizuanData',JSON.stringify(d))}catch(e){}}paint();try{await db.rpc('push_screen_event',{p_host_id:null,p_gallery_id:null,p_gallery_item_id:null,p_sister_id:null,p_event_type:'unified_'+mode,p_message:'一体式投屏切换：'+mode})}catch(e){console.warn('远程模式写入失败',e)}}
function tab(x){document.getElementById('song').classList.toggle('show',x==='song');document.getElementById('gallery').classList.toggle('show',x==='gallery');document.getElementById('tSong').classList.toggle('active',x==='song');document.getElementById('tGallery').classList.toggle('active',x==='gallery')}
window.addEventListener('storage',paint);paint();tab('song');function openPositions(){window.open('positions.html','huizuan_positions','width=760,height=900,resizable=yes,scrollbars=yes')}
</script></body></html>
