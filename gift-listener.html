<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUI ZUAN｜大号自动点亮监听器 V0.3</title>
<style>
:root{color-scheme:dark;--bg:#06080b;--p:#10141b;--l:#303947;--t:#f4f7fb;--m:#9aa6b6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#252d39,#090c11 42%,#050608);font-family:"Microsoft YaHei",sans-serif;color:var(--t)}
.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}
h1{font-size:21px;margin:0}.sub{color:var(--m);font-size:13px;margin-top:6px}.pill{border:1px solid #46515f;border-radius:99px;padding:7px 11px;font-size:12px}
.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:16px}.card{background:#0f131aee;border:1px solid #252d38;border-radius:17px;padding:15px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}button.secondary{background:#1b222d;color:#eef3f8;border:1px solid #364150}button:disabled{opacity:.4}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden}video{width:100%;height:100%;object-fit:contain}
.crop{position:absolute;left:3%;right:3%;bottom:2%;height:27%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 9999px #0003;pointer-events:none}
.crop:before{content:"OCR 送礼监控区";position:absolute;top:-26px;left:7px;font-size:12px;background:#080b0fcc;padding:3px 6px;border-radius:5px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.sliders label{font-size:12px;color:#b1bac8}.sliders input{width:100%}
.status{font-size:13px;line-height:1.65;padding:11px;background:#080b0f;border-radius:10px;margin-bottom:10px}.good{color:#98e8b5}.bad{color:#ffbd8a}.muted{color:#929eae}
.raw{font-family:Consolas,"Microsoft YaHei";font-size:12px;white-space:pre-wrap;background:#080b0f;border:1px solid #242c37;border-radius:10px;padding:10px;min-height:86px;margin-bottom:10px}
.log{height:330px;overflow:auto;background:#080b0f;border:1px solid #242c37;border-radius:10px;padding:8px}.entry{padding:9px;border-bottom:1px solid #171d25;font-size:13px}.entry b{color:#fff}.time{color:#748093;font-family:Consolas}
canvas{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.log{height:240px}}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><h1>HUI ZUAN · BIG ACCOUNT LISTENER</h1><div class="sub">V0.4｜12人名称校正 · 模拟点亮</div></div><div class="pill">模拟模式 · 不写正式展馆</div></div>
<div class="grid">
<section class="card">
<div class="toolbar"><button id="share">① 分享大号画面</button><button id="ocrInit" class="secondary">② 加载中文识别</button><button id="start" disabled>③ 开始识别</button><button id="stop" class="secondary" disabled>停止</button></div>
<div class="stage"><video id="video" autoplay muted playsinline></video><div class="crop" id="crop"></div></div>
<div class="sliders"><label>监控区高度 <input id="h" type="range" min="10" max="55" value="27"></label><label>距离底部 <input id="b" type="range" min="0" max="40" value="2"></label></div>
<canvas id="canvas"></canvas>
</section>
<aside class="card">
<div class="status" id="status">先分享鲨熠大号画面，再加载中文识别模型。第一次加载会比之后慢。</div>
<div class="muted" style="font-size:12px;margin:0 0 6px">OCR 原文</div><div class="raw" id="raw">尚未识别</div>
<div class="muted" style="font-size:12px;margin:0 0 6px">送礼识别记录</div><div class="log" id="log"></div>
</aside></div></div>
<script type="module">
const $=s=>document.querySelector(s), video=$("#video"), canvas=$("#canvas"), crop=$("#crop");
let stream=null,ocr=null,timer=null,busy=false,lastSig="",lastAt=0;
function stat(s,c=""){const el=$("#status");el.className="status "+c;el.textContent=s}
function sync(){crop.style.height=$("#h").value+"%";crop.style.bottom=$("#b").value+"%"} $("#h").oninput=sync;$("#b").oninput=sync;sync();
function add(o){const d=document.createElement("div");d.className="entry";d.innerHTML=`<span class="time">${new Date().toLocaleTimeString()}</span><br><b>${esc(o.sister)}</b> → <b>${esc(o.host)}</b><br>${esc(o.gift)} × ${o.qty}`;$("#log").prepend(d)}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
$("#share").onclick=async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:10,max:15}},audio:false});video.srcObject=stream;stat("✓ 大号画面已连接。下一步加载中文识别。","good");checkReady();stream.getVideoTracks()[0].onended=()=>{stream=null;checkReady();stat("画面分享已结束。","bad")}}catch(e){stat("未取得画面："+e.name+" "+e.message,"bad")}};
$("#ocrInit").onclick=async()=>{const btn=$("#ocrInit");btn.disabled=true;stat("正在加载 PaddleOCR 中文模型… 第一次需要下载模型，请稍候。");try{
 const mod=await import("https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm");
 ocr=await mod.PaddleOCR.create({lang:"ch",ocrVersion:"PP-OCRv5",ortOptions:{backend:"wasm",wasmPaths:"https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/"}});
 stat("✓ 中文 OCR 已就绪。可以开始识别。","good");btn.textContent="✓ 中文识别已加载";checkReady();
}catch(e){console.error(e);stat("OCR 加载失败："+(e.message||e)+"。如果河南网络无法加载 CDN，我们再把模型改成本地放进 GitHub。","bad");btn.disabled=false}};
function checkReady(){$("#start").disabled=!(stream&&ocr)}
function grab(){
 if(!video.videoWidth)return null; const vw=video.videoWidth,vh=video.videoHeight,hp=+$("#h").value/100,bp=+$("#b").value/100;
 const sy=Math.max(0,Math.round(vh*(1-bp-hp))),sh=Math.min(vh-sy,Math.round(vh*hp));
 canvas.width=vw;canvas.height=sh;const x=canvas.getContext("2d");x.drawImage(video,0,sy,vw,sh,0,0,vw,sh);return canvas
}
function normalize(s){return s.replace(/\s+/g," ").replace(/[：:]/g,":").trim()}
const HOSTS=["空白","青决","弋阳","防","雾","鲨熠","祈年","艾","宸御","北北","辣椒油","宋焱"];
const HOST_ALIASES={"鲨翌":"鲨熠","青诀":"青决"};
function correctHost(raw){const t=normalize(raw);if(HOST_ALIASES[t])return HOST_ALIASES[t];const exact=HOSTS.find(x=>t===x||t.includes(x)||x.includes(t));return exact||t}

function parseGift(text){
 const lines=text.split(/\n+/).map(normalize).filter(Boolean);
 const joined=lines.join(" ");
 // 兼容：海棠花 送给鲨熠 + 1个 暮光恋人；以及单行「A送给B 1个礼物」
 let m=joined.match(/(.{1,28}?)\s*送给\s*(.{1,18}?)(?:\s+|$).*?(\d+)\s*个\s*([^\s，,。]{1,24})/);
 if(m)return {sister:m[1].trim(),host:correctHost(m[2].trim()),qty:+m[3],gift:m[4].trim()};
 // 数量可能在前一行
 const q=joined.match(/(\d+)\s*个\s*([^\s，,。]{1,24})/), sh=joined.match(/(.{1,28}?)\s*送给\s*(.{1,18})(?:\s|$)/);
 if(q&&sh)return {sister:sh[1].trim(),host:correctHost(sh[2].trim()),qty:+q[1],gift:q[2].trim()};
 return null
}
async function tick(){
 if(busy||!ocr)return;busy=true;
 try{const c=grab();if(!c)return;const [res]=await ocr.predict(c,{textRecScoreThresh:.45});
  const text=(res.items||[]).map(x=>x.text).join("\n");$("#raw").textContent=text||"（本帧没有识别到文字）";
  const g=parseGift(text);if(g){const sig=[g.sister,g.host,g.gift,g.qty].join("|"),now=Date.now();
   // 仅防止同一字幕停留在连续帧中重复入账；隔 2.8 秒后相同字幕可再次成为新礼物
   if(sig!==lastSig || now-lastAt>2800){lastSig=sig;lastAt=now;add(g)}
  }
 }catch(e){console.error(e);stat("识别发生错误："+(e.message||e),"bad")}finally{busy=false}
}
$("#start").onclick=()=>{if(timer)return;timer=setInterval(tick,1200);tick();$("#start").disabled=true;$("#stop").disabled=false;stat("● 正在识别送礼区域｜测试模式，不会点亮展馆。","good")};
$("#stop").onclick=()=>{clearInterval(timer);timer=null;$("#stop").disabled=true;checkReady();stat("识别已停止。","muted")};
</script></body></html>
