<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUI ZUAN｜大号自动点亮监听器 V0.6</title>
<style>
:root{color-scheme:dark;--bg:#06080b;--p:#10141b;--l:#303947;--t:#f4f7fb;--m:#9aa6b6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#252d39,#090c11 42%,#050608);font-family:"Microsoft YaHei",sans-serif;color:var(--t)}
.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}
h1{font-size:21px;margin:0}.sub{color:var(--m);font-size:13px;margin-top:6px}.pill{border:1px solid #46515f;border-radius:99px;padding:7px 11px;font-size:12px}
.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:16px}.card{background:#0f131aee;border:1px solid #252d38;border-radius:17px;padding:15px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}button.secondary{background:#1b222d;color:#eef3f8;border:1px solid #364150}button:disabled{opacity:.4}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden}video{width:100%;height:100%;object-fit:contain}
.crop{position:absolute;left:3%;right:45%;bottom:2%;height:27%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 9999px #0003;pointer-events:none}
.crop:before{content:"OCR 送礼监控区";position:absolute;top:-26px;left:7px;font-size:12px;background:#080b0fcc;padding:3px 6px;border-radius:5px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.sliders label{font-size:12px;color:#b1bac8}.sliders input{width:100%}
.status{font-size:13px;line-height:1.65;padding:11px;background:#080b0f;border-radius:10px;margin-bottom:10px}.good{color:#98e8b5}.bad{color:#ffbd8a}.muted{color:#929eae}
.raw{font-family:Consolas,"Microsoft YaHei";font-size:12px;white-space:pre-wrap;background:#080b0f;border:1px solid #242c37;border-radius:10px;padding:10px;min-height:86px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:999}.modal.show{display:grid}.dialog{width:min(520px,92vw);max-height:80vh;overflow:auto;background:#111720;border:1px solid #3b4655;border-radius:16px;padding:18px}.dialog h3{margin:0 0 12px}.choices{display:grid;gap:8px}.choices button{text-align:left;background:#1a2230;color:#fff;border:1px solid #394657}.dialog .row{display:flex;gap:8px;margin-top:12px}.dialog select{width:100%;padding:10px;background:#0b1017;color:#fff;border:1px solid #394657;border-radius:9px}.log{height:330px;overflow:auto;background:#080b0f;border:1px solid #242c37;border-radius:10px;padding:8px}.entry{padding:9px;border-bottom:1px solid #171d25;font-size:13px}.entry b{color:#fff}.time{color:#748093;font-family:Consolas}
canvas{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.log{height:240px}}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><h1>HUI ZUAN · BIG ACCOUNT LISTENER</h1><div class="sub">V0.8｜正式自动点亮 · 姐姐身份确认</div></div><div class="pill">正式模式 · 自动写入展馆</div></div>
<div class="grid">
<section class="card">
<div class="toolbar"><button id="share">① 分享大号画面</button><button id="ocrInit" class="secondary">② 加载中文识别</button><button id="start" disabled>③ 开始识别</button><button id="stop" class="secondary" disabled>停止</button></div>
<div class="stage"><video id="video" autoplay muted playsinline></video><div class="crop" id="crop"></div></div>
<div class="sliders"><label>监控区高度 <input id="h" type="range" min="8" max="70" value="27"></label><label>距离底部 <input id="b" type="range" min="0" max="70" value="2"></label><label>距离左侧 <input id="l" type="range" min="0" max="80" value="3"></label><label>距离右侧 <input id="r" type="range" min="0" max="80" value="45"></label></div>
<canvas id="canvas"></canvas>
</section>
<aside class="card">
<div class="status" id="status">先分享鲨熠大号画面，再加载中文识别模型。第一次加载会比之后慢。</div>
<div class="muted" style="font-size:12px;margin:0 0 6px">OCR 原文</div><div class="raw" id="raw">尚未识别</div>
<div class="muted" style="font-size:12px;margin:0 0 6px">送礼识别记录</div><div class="log" id="log"></div>
</aside></div></div>
<div class="modal" id="sisterModal"><div class="dialog"><h3 id="sisterTitle">发现未识别姐姐</h3><div id="sisterStep"></div></div></div>
<script type="module">
const $=s=>document.querySelector(s), video=$("#video"), canvas=$("#canvas"), crop=$("#crop");
let stream=null,ocr=null,timer=null,busy=false,lastSig="",lastAt=0;
const AUTO_SISTER_KEY="huizuan_auto_add_sister";
const SB="https://ossaeaswzzfrekguefkh.supabase.co";
const KEY="sb_publishable_xxEoSgJZGaNrLmJnr1gtng_Xoxnd_Nn";
const HEAD={apikey:KEY,Authorization:"Bearer "+KEY};
function autoAddSister(){return localStorage.getItem(AUTO_SISTER_KEY)!=="0"}
async function sb(path){const r=await fetch(SB+"/rest/v1/"+path,{headers:HEAD});if(!r.ok)throw new Error("Supabase "+r.status+" "+await r.text());return r.json()}
function eq(v){return encodeURIComponent(v)}
async function rpc(name,body){const r=await fetch(SB+"/rest/v1/rpc/"+name,{method:"POST",headers:{...HEAD,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(name+" "+r.status+" "+await r.text());const t=await r.text();try{return JSON.parse(t)}catch{return t}}
let sisterResolver=null;
function closeSisterModal(v){$("#sisterModal").classList.remove("show");if(sisterResolver){const r=sisterResolver;sisterResolver=null;r(v)}}
async function resolveUnknownSister(nickname){
 const all=await sb("sisters?select=id,nickname&is_active=eq.true&order=nickname.asc");
 return new Promise(resolve=>{
  sisterResolver=resolve;$("#sisterModal").classList.add("show");$("#sisterTitle").textContent="发现「"+nickname+"」，是否为旧姐姐？";
  $("#sisterStep").innerHTML='<div class="row"><button id="oldYes">是，选择旧姐姐</button><button id="oldNo" class="secondary">否</button></div>';
  $("#oldYes").onclick=()=>{$("#sisterStep").innerHTML='<select id="oldList"><option value="">请选择以往姐姐</option>'+all.map(x=>'<option value="'+x.id+'">'+esc(x.nickname)+'</option>').join("")+'</select><div class="row"><button id="oldOk">确认绑定</button><button id="oldBack" class="secondary">返回</button></div>';$("#oldOk").onclick=()=>{const id=+$("#oldList").value;if(!id)return;const s=all.find(x=>x.id===id);closeSisterModal(s)};$("#oldBack").onclick=()=>closeSisterModal(null)};
  $("#oldNo").onclick=()=>{$("#sisterTitle").textContent="是否新增姐姐「"+nickname+"」？";$("#sisterStep").innerHTML='<div class="row"><button id="newYes">是，新增姐姐</button><button id="newNo" class="secondary">否，跳过这笔</button></div>';$("#newYes").onclick=async()=>{try{await rpc("add_sister",{p_name:nickname});const rows=await sb("sisters?select=id,nickname&is_active=eq.true&nickname=eq."+eq(nickname)+"&order=id.desc&limit=1");closeSisterModal(rows[0]||null)}catch(e){stat("新增姐姐失败："+e.message,"bad")}};$("#newNo").onclick=()=>closeSisterModal(null)};
 });
}
async function postGift(out){
 if(!out.sister_id){const chosen=await resolveUnknownSister(out.sister);if(!chosen){out.checks.push("⊘ 姐姐未确认，本笔未入账");return out}out.sister_id=chosen.id;out.checks.push("✓ 使用姐姐："+chosen.nickname)}
 // 入账前先记录整馆状态。只有真正从“未满”跨到“满展”时才发一次满展事件。
 const beforeItems=await sb("gallery_items?select=id,current_count,target_count&gallery_id=eq."+out.gallery_id);
 const wasFull=beforeItems.length>0&&beforeItems.every(x=>Number(x.current_count)>=Number(x.target_count));
 for(let i=0;i<out.qty;i++)await rpc("light_gallery_item",{p_gallery_item_id:out.gallery_item_id,p_sister_id:out.sister_id});
 out.checks.push("✓ 已正式入账 +"+out.qty);out.written=true;
 const afterItems=await sb("gallery_items?select=id,current_count,target_count&gallery_id=eq."+out.gallery_id);
 const isFull=afterItems.length>0&&afterItems.every(x=>Number(x.current_count)>=Number(x.target_count));
 if(!wasFull&&isFull){
  try{
   await rpc("push_screen_event",{p_host_id:out.host_id,p_gallery_id:out.gallery_id,p_gallery_item_id:out.gallery_item_id,p_sister_id:out.sister_id,p_event_type:"gallery_full",p_message:"自动送礼达成满展"});
   out.checks.push("✦ 已触发满展贺图");
  }catch(e){
   console.error("满展事件发送失败",e);
   out.checks.push("⚠ 已满展，但贺图事件发送失败");
  }
 }
 return out
}
async function matchGift(g){
 const out={...g,checks:[],ready:false};
 const hs=await sb("hosts?select=id,name&is_active=eq.true&name=eq."+eq(g.host)+"&limit=1");
 if(!hs.length){out.checks.push("✕ 主持未匹配");return out}
 out.host_id=hs[0].id;out.checks.push("✓ 主持："+hs[0].name);
 const ss=await sb("sisters?select=id,nickname&is_active=eq.true&nickname=eq."+eq(g.sister)+"&limit=1");
 if(ss.length){out.sister_id=ss[0].id;out.checks.push("✓ 姐姐："+ss[0].nickname)}
 else out.checks.push(autoAddSister()?"△ 新姐姐，正式模式将自动建档":"△ 新姐姐，等待人工确认");
 const ws=await sb("weeks?select=id,week_name,start_date,end_date&is_current=eq.true&is_closed=eq.false&order=start_date.desc&limit=1");
 if(!ws.length){out.checks.push("✕ 找不到本周");return out}
 out.week_id=ws[0].id;out.checks.push("✓ 本周："+(ws[0].week_name||ws[0].start_date));
 const gs=await sb("host_galleries?select=id,gallery_size,is_full&host_id=eq."+out.host_id+"&week_id=eq."+out.week_id+"&order=id.desc&limit=1");
 if(!gs.length){out.checks.push("✕ 主持本周没有展馆");return out}
 out.gallery_id=gs[0].id;out.checks.push("✓ 当前展馆："+gs[0].gallery_size+"馆");
 const items=await sb("gallery_items?select=id,item_name,current_count,target_count&gallery_id=eq."+out.gallery_id+"&order=sort_order.asc");
 const norm=x=>normalize(x).replace(/[·•]/g,"");
 const gi=items.find(x=>norm(x.item_name)===norm(g.gift))||items.find(x=>norm(x.item_name).includes(norm(g.gift))||norm(g.gift).includes(norm(x.item_name)));
 if(!gi){out.checks.push("✕ 礼物未匹配："+g.gift);return out}
 out.gallery_item_id=gi.id;out.gift=gi.item_name;out.current_count=gi.current_count;out.target_count=gi.target_count;
 out.checks.push("✓ 礼物："+gi.item_name+" "+gi.current_count+"/"+gi.target_count);
 out.checks.push("→ 准备正式入账 +"+g.qty);
 out.ready=true;return out
}
function stat(s,c=""){const el=$("#status");el.className="status "+c;el.textContent=s}
function sync(){crop.style.height=$("#h").value+"%";crop.style.bottom=$("#b").value+"%";crop.style.left=$("#l").value+"%";crop.style.right=$("#r").value+"%"} ["#h","#b","#l","#r"].forEach(id=>$(id).oninput=sync);sync();
function add(o){const d=document.createElement("div");d.className="entry";const checks=(o.checks||[]).map(x=>esc(x)).join("<br>");d.innerHTML=`<span class="time">${new Date().toLocaleTimeString()}</span><br><b>${esc(o.sister)}</b> → <b>${esc(o.host)}</b><br>${esc(o.gift)} × ${o.qty}<br><span class="muted">${checks}</span>`;$("#log").prepend(d)}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
$("#share").onclick=async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:10,max:15}},audio:false});video.srcObject=stream;stat("✓ 大号画面已连接。下一步加载中文识别。","good");checkReady();stream.getVideoTracks()[0].onended=()=>{window.__HUIZUAN_MONITOR_RUNNING__=false;stream=null;checkReady();stat("画面分享已结束。","bad")}}catch(e){stat("未取得画面："+e.name+" "+e.message,"bad")}};
$("#ocrInit").onclick=async()=>{const btn=$("#ocrInit");btn.disabled=true;stat("正在加载 PaddleOCR 中文模型… 第一次需要下载模型，请稍候。");try{
 const mod=await import("https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm");
 ocr=await mod.PaddleOCR.create({lang:"ch",ocrVersion:"PP-OCRv5",ortOptions:{backend:"wasm",wasmPaths:"https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/"}});
 stat("✓ 中文 OCR 已就绪。可以开始识别。","good");btn.textContent="✓ 中文识别已加载";checkReady();
}catch(e){console.error(e);stat("OCR 加载失败："+(e.message||e)+"。如果河南网络无法加载 CDN，我们再把模型改成本地放进 GitHub。","bad");btn.disabled=false}};
function checkReady(){$("#start").disabled=!(stream&&ocr)}
function grab(){
 if(!video.videoWidth)return null; const vw=video.videoWidth,vh=video.videoHeight,hp=+$("#h").value/100,bp=+$("#b").value/100;
 const lp=+$("#l").value/100,rp=+$("#r").value/100;
 const sx=Math.max(0,Math.round(vw*lp)),sw=Math.max(1,Math.round(vw*(1-lp-rp)));
 const sy=Math.max(0,Math.round(vh*(1-bp-hp))),sh=Math.min(vh-sy,Math.round(vh*hp));
 canvas.width=sw;canvas.height=sh;const x=canvas.getContext("2d");x.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);return canvas
}
function normalize(s){return s.replace(/\s+/g," ").replace(/[：:]/g,":").trim()}
const HOSTS=["空白","青决","弋阳","防","雾","鲨熠","祈年","艾","宸御","北北","辣椒油","宋焱"];
const HOST_ALIASES={"鲨翌":"鲨熠","青诀":"青决"};
function correctHost(raw){const t=normalize(raw);if(HOST_ALIASES[t])return HOST_ALIASES[t];const exact=HOSTS.find(x=>t===x||t.includes(x)||x.includes(t));return exact||t}

function parseGift(text){
 const lines=text.split(/\n+/).map(normalize).filter(Boolean);
 const anchor=lines.findIndex(x=>x.includes("送给"));
 if(anchor<0)return null;
 const nearby=lines.slice(Math.max(0,anchor-1),Math.min(lines.length,anchor+4));
 const joined=nearby.join(" ");
 // 「送给」是硬锚点：只解析它附近的姐姐、主持、数量和礼物，其余 OCR 杂讯忽略
 let m=joined.match(/(.{1,28}?)\s*送给\s*(.{1,18}?)(?:\s+|$).*?(\d+)\s*个\s*([^\s，,。]{1,24})/);
 if(m)return {sister:m[1].trim(),host:correctHost(m[2].trim()),qty:+m[3],gift:m[4].trim()};
 // 数量可能在前一行
 const q=joined.match(/(\d+)\s*个\s*([^\s，,。]{1,24})/), sh=joined.match(/(.{1,28}?)\s*送给\s*(.{1,18})(?:\s|$)/);
 if(q&&sh)return {sister:sh[1].trim(),host:correctHost(sh[2].trim()),qty:+q[1],gift:q[2].trim()};
 return null
}
async function tick(){
 if(busy||!ocr)return;busy=true;
 try{const c=grab();if(!c)return;const [res]=await ocr.predict(c,{textRecScoreThresh:.45});
  const text=(res.items||[]).map(x=>x.text).join("\n");$("#raw").textContent=text||"（本帧没有识别到文字）";
  const g=parseGift(text);if(g){const sig=[g.sister,g.host,g.gift,g.qty].join("|"),now=Date.now();
   // 仅防止同一字幕停留在连续帧中重复入账；隔 2.8 秒后相同字幕可再次成为新礼物
   if(sig!==lastSig || now-lastAt>2800){lastSig=sig;lastAt=now;let matched=await matchGift(g);if(matched.ready)matched=await postGift(matched);add(matched)}
  }
 }catch(e){console.error(e);stat("识别发生错误："+(e.message||e),"bad")}finally{busy=false}
}
$("#start").onclick=()=>{if(timer)return;window.__HUIZUAN_MONITOR_RUNNING__=true;timer=setInterval(tick,1200);tick();$("#start").disabled=true;$("#stop").disabled=false;stat("● 正在识别并自动写入 Supabase 展馆。陌生姐姐会先要求确认身份。","good")};
$("#stop").onclick=()=>{window.__HUIZUAN_MONITOR_RUNNING__=false;clearInterval(timer);timer=null;$("#stop").disabled=true;checkReady();stat("识别已停止。","muted")};
</script></body></html>
