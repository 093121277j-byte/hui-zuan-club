const fallbackIcon=name=>({"小心心":"♡","玫瑰花":"✿","大啤酒":"♨","棒棒糖":"◉","加油鸭":"♛","爱你呦":"♥","暮光星辰":"✦","比心兔兔":"♧","比心":"♡","礼花筒":"✧","珍爱玫瑰":"❀","一束花开":"❁","热气球":"◌","真的爱你":"♥","暮光恋人":"✦","万象烟花":"✺","跑车":"◆","暮光明珠":"●","花海泛舟":"❋","星光营地":"⌂","星光庄园":"♜","暮光花海":"✿","豪华邮轮":"≋","暮光瀑布":"≋","星际玫瑰":"✥","抖音一号":"1","抖音飞艇":"◇","云中秘境":"☁","嘉年华":"✺"}[name]||"✦");
function utc8DateString(){
 const now=new Date(),d=new Date(now.getTime()+8*60*60*1000);
 return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
function dateOnly(v){return v?String(v).slice(0,10):""}
async function getCurrentWeek(){
 const today=utc8DateString();
 const r=await db.from("weeks").select("*").order("start_date",{ascending:true});
 if(r.error)throw r.error;
 const all=r.data||[];
 const current=all.find(w=>{
   const s=dateOnly(w.start_date),e=dateOnly(w.end_date);
   return s&&e&&s<=today&&today<=e;
 });
 if(current)return current;
 const marked=all.find(w=>w.is_current===true);
 if(marked)return marked;
 throw new Error(`找不到 ${today} 所属周次`);
}
async function loadAll(){if(refreshing)return;refreshing=true;try{week=await getCurrentWeek();if(!week)throw new Error("找不到当前周次");$("weekName").textContent=week.week_name;const g=await db.from("host_galleries").select("id,host_id,gallery_size,is_full,full_at,hosts(id,name,avatar_url,full_cg_url,full_voice_url,sort_order)").eq("week_id",week.id);if(g.error)throw g.error;let gs=(g.data||[]).filter(x=>x.hosts).sort((a,b)=>(a.hosts.sort_order||0)-(b.hosts.sort_order||0));const ids=gs.map(x=>x.id);let its=[];if(ids.length){const ir=await db.from("gallery_items").select("id,gallery_id,item_name,image_url,target_count,current_count,sort_order,completed_at").in("gallery_id",ids).order("sort_order");if(ir.error)throw ir.error;its=ir.data||[]}entries=gs.map(x=>({...x,items:its.filter(i=>+i.gallery_id===+x.id)}));if(screenLocked&&lockedHostId!=null){const p=entries.findIndex(x=>Number(x.hosts?.id)===Number(lockedHostId));if(p>=0)idx=p}else if(idx>=entries.length)idx=0;renderDots();detectChanges();renderCurrent();if(!screenLocked)$("status").textContent="实时展馆 · 已连接"}catch(e){console.error(e);$("status").textContent="连接异常 · "+e.message}finally{refreshing=false}}
function renderDots(){$("dots").innerHTML=entries.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join("")}
function renderCurrent(){if(!entries.length){document.body.classList.remove("target-achieved");$("grid").className="grid g24";$("grid").innerHTML='<div class="empty">本周尚未建立展馆</div>';$("hostName").textContent="HUI ZUAN";$("galleryName").textContent="等待展馆建立";return}const e=entries[idx],h=e.hosts;const rankMap={12:"C",20:"B",24:"A",28:"S"};const rank=rankMap[Number(e.gallery_size)]||"C";$("galleryRank").textContent=rank;$("galleryClass").dataset.rank=rank;$("hostName").textContent=h.name;$("avatar").src=h.avatar_url||"";$("galleryName").textContent=`${galleryNames[e.gallery_size]||"展馆"} · ${e.gallery_size}馆`;const done=e.items.filter(x=>+x.current_count>=+x.target_count).length;const weeklyTarget=+e.gallery_size===12?12:15;const weeklyDone=Math.min(done,weeklyTarget);document.body.classList.toggle("target-achieved",weeklyDone>=weeklyTarget);$("weeklyDone").textContent=weeklyDone;$("weeklyTarget").textContent=weeklyTarget;$("weeklyBar").style.width=Math.min(100,weeklyDone/weeklyTarget*100)+"%";$("doneItems").textContent=done;$("totalItems").textContent=` / ${e.items.length}`;$("grid").className=`grid g${e.gallery_size}`;const rows=Math.ceil(e.gallery_size/4);$("grid").innerHTML=e.items.map((x,i)=>{const d=+x.current_count>=+x.target_count;const pos=Number(x.sort_order||i+1);const row=rows-Math.floor((pos-1)/4);const col=((pos-1)%4)+1;return `<div class="gift ${d?'done':''}" data-id="${x.id}" style="grid-row:${row};grid-column:${col}"><div class="icon">${(x.image_url||screenshotGiftIcon(x.item_name)||officialGiftIcon(x.item_name))?`<img src="${esc(x.image_url||screenshotGiftIcon(x.item_name)||officialGiftIcon(x.item_name))}" alt="${esc(x.item_name)}" onerror="this.outerHTML='${fallbackIcon(x.item_name)}'">`:fallbackIcon(x.item_name)}</div><div class="giftName">${esc(x.item_name)}</div><div class="count">${x.current_count} / ${x.target_count}</div></div>`}).join("");renderDots()}
async function detectChanges(){
 const completed=[];
 for(const e of entries){
  const isFull=e.is_full||(e.items.length&&e.items.every(i=>+i.current_count>=+i.target_count));
  const wasFull=lastFull.get(e.id);
  lastFull.set(e.id,!!isFull);
  // 只有展馆真的退回未满，才重新武装下一次满展 CG。
  if(!isFull)resetPlayedFullCG(e);
  for(const item of e.items){
   const old=lastCounts.get(item.id);
   const now=+item.current_count,target=+item.target_count;
   // 只有「这一格第一次跨过目标」才播放姐姐点亮动画，普通 +1 不播放。
   if(old!=null && old<target && now>=target) completed.push({e,item});
   lastCounts.set(item.id,now);
  }
  if(wasFull===false&&isFull){setTimeout(()=>{idx=entries.findIndex(x=>x.id===e.id);renderCurrent();$("status").textContent=`${e.hosts.name} · 检测到满展`;showFullCG(e)},1200)}
 }
 for(const x of completed) enqueueWinnerNotice(x.e,x.item);
}
async function getWinner(itemId){
 const r=await db.from("light_records").select("id,sister_id,quantity,created_at,sisters(nickname)").eq("gallery_item_id",itemId).order("id",{ascending:true});
 if(r.error)throw r.error;
 const m=new Map();
 for(const rec of r.data||[]){
  const sid=String(rec.sister_id),q=Number(rec.quantity||1);
  if(!m.has(sid))m.set(sid,{nickname:rec.sisters?.nickname||"未知姐姐",qty:0,firstId:Number(rec.id),firstAt:rec.created_at});
  const x=m.get(sid);x.qty+=q;x.firstId=Math.min(x.firstId,Number(rec.id));
 }
 return [...m.values()].sort((a,b)=>b.qty-a.qty||a.firstId-b.firstId)[0]||null;
}
async function enqueueWinnerNotice(e,item){
 try{const winner=await getWinner(item.id);noticeQueue.push({e,item,winner});playNoticeQueue()}catch(err){console.error("点亮姐姐判定失败",err)}
}
function playNoticeQueue(){
 if(noticeBusy||!noticeQueue.length)return;
 noticeBusy=true;const {e,item,winner}=noticeQueue.shift();
 idx=entries.findIndex(x=>x.id===e.id);renderCurrent();
 $("noticeTop").textContent=`${winner?.nickname||"姐姐"} · 点亮 ${e.hosts.name}`;
 $("noticeMain").textContent=`✦ ${item.item_name} ✦`;
 $("notice").classList.add("show");
 playItemSound();
 setTimeout(()=>document.querySelector(`[data-id="${item.id}"]`)?.classList.add("flash"),80);
 setTimeout(()=>{$("notice").classList.remove("show");setTimeout(()=>{noticeBusy=false;playNoticeQueue()},350)},3000);
}
let audioCtx=null;
function getAudioCtx(){
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  return audioCtx;
 }catch(_){return null}
}
function tone(freq,start,dur,gain=.055,type="sine"){
 const ac=getAudioCtx();if(!ac)return;
 const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime+start);
 g.gain.setValueAtTime(0.0001,ac.currentTime+start);g.gain.exponentialRampToValueAtTime(gain,ac.currentTime+start+.025);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+start+dur);
 o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+start);o.stop(ac.currentTime+start+dur+.03);
}
function playItemSound(){tone(880,0,.42,.04);tone(1320,.11,.52,.032);tone(1760,.23,.58,.022)}
function playFullSound(){tone(392,0,.65,.045);tone(523.25,.12,.8,.05);tone(659.25,.26,.9,.05);tone(783.99,.42,1.05,.055);tone(1046.5,.7,1.25,.04)}
let fullVoiceAudio=null;
function stopFullVoice(){
 if(!fullVoiceAudio)return;
 try{fullVoiceAudio.pause();fullVoiceAudio.currentTime=0}catch(_){}
 fullVoiceAudio=null;
}
async function playFullVoice(h){
 const voiceUrl=String(h?.full_voice_url||"").trim();
 if(!voiceUrl){playFullSound();return false}
 stopFullVoice();
 try{
  const a=new Audio(voiceUrl);fullVoiceAudio=a;a.preload="auto";a.volume=1;
  a.onerror=()=>{if(fullVoiceAudio===a)fullVoiceAudio=null;console.error("满展语音读取失败",voiceUrl);playFullSound()};
  a.onended=()=>{if(fullVoiceAudio===a)fullVoiceAudio=null};
  await a.play();return true;
 }catch(err){
  console.warn("满展语音播放失败，改播默认满展音效",err);
  if(fullVoiceAudio){try{fullVoiceAudio.pause()}catch(_){}fullVoiceAudio=null}
  playFullSound();return false;
 }
}
async function getGallerySponsor(e){
 try{
  const itemIds=(e?.items||[]).map(x=>Number(x.id)).filter(Boolean);
  if(!itemIds.length)return null;
  const r=await db.from("light_records").select("sister_id,quantity,sisters(nickname)").in("gallery_item_id",itemIds);
  if(r.error)throw r.error;
  const rows=r.data||[];if(!rows.length)return null;
  const ids=[...new Set(rows.map(x=>String(x.sister_id)))];
  if(ids.length!==1)return null;
  return rows.find(x=>x.sisters?.nickname)?.sisters?.nickname||null;
 }catch(err){console.error("全馆冠名判定失败",err);return null}
}
async function showFullCG(e){
 const gid=Number(e?.id);
 // 同一展馆同一次满展只允许进入一次。远端事件与本地侦测共用这把锁。
 if(!gid)return;
 if(fullCgPlaying.has(gid)||hasPlayedFullCG(e)){
   console.info("满展CG已播放，本次重复触发已忽略",gid);
   return;
 }
 fullCgPlaying.add(gid);
 markPlayedFullCG(e);
 const h=e?.hosts;
 const url=String(h?.full_cg_url||"").trim();
 if(!h||!url){
   console.error("满展CG缺少地址",h);
   $("status").textContent=`${h?.name||"哥哥"} · 未设置满展CG`;
   resetPlayedFullCG(e);
   return;
 }
 const layer=$("cg"),img=$("cgImg");
 const marquee=$("cgMarquee"),marqueeText=$("cgMarqueeText");
 marquee.classList.remove("show");marqueeText.textContent="";
 const sponsor=await getGallerySponsor(e);
 if(sponsor){marqueeText.textContent=`✦ ${sponsor}冠名全馆 ✦`;marquee.classList.add("show");clearTimeout(window.__marquee);window.__marquee=setTimeout(()=>{marquee.classList.remove("show");marqueeText.textContent=""},6250)}
 $("cgHost").textContent=h.name;
 clearTimeout(window.__cg);
 layer.classList.remove("show");
 img.onload=()=>{
   $("status").textContent=`${h.name} · 满展CG播放中`;
   playFullVoice(h);
   requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add("show")));
   window.__cg=setTimeout(()=>{
     layer.classList.remove("show");marquee.classList.remove("show");
     stopFullVoice();
     fullCgPlaying.delete(gid);
     $("status").textContent=screenLocked?`远程锁定 · ${h.name}`:"实时展馆 · 自动轮播";
   },7000);
 };
 img.onerror=()=>{
   console.error("满展CG图片读取失败",url);
   $("status").textContent=`${h.name} · 满展CG图片读取失败`;
   layer.classList.remove("show");
   stopFullVoice();
   resetPlayedFullCG(e);
 };
 img.src=url;
}

async function applyScreenCommand(cmd){
 if(!cmd)return;
 if(cmd.event_type==="screen_switch"){
   const hostId=Number(cmd.host_id);
   const pos=entries.findIndex(x=>Number(x.hosts?.id)===hostId);
   if(pos<0){console.warn("目标哥哥本周没有展馆",hostId);return}
   screenLocked=true;lockedHostId=hostId;idx=pos;renderCurrent();
   $("status").textContent=`远程锁定 · ${entries[pos].hosts.name}`;
 }else if(cmd.event_type==="screen_auto"){
   screenLocked=false;lockedHostId=null;
   $("status").textContent="实时展馆 · 自动轮播";
   renderCurrent();
 }else if(cmd.event_type==="gallery_full"){
   // 先重新抓一次数据库，确保刚刚一键点亮后的最新数据已进入投屏。
   await loadAll();
   const hostId=Number(cmd.host_id);
   let pos=entries.findIndex(x=>Number(x.hosts?.id)===hostId);
   if(pos<0 && cmd.gallery_id!=null){
     pos=entries.findIndex(x=>Number(x.id)===Number(cmd.gallery_id));
   }
   if(pos<0){
     console.warn("收到满展事件，但找不到对应展馆",cmd);
     $("status").textContent="收到满展事件 · 找不到对应展馆";
     return;
   }
   idx=pos;
   renderCurrent();
   $("status").textContent=`${entries[pos].hosts.name} · 满展事件已接收`;
   setTimeout(()=>showFullCG(entries[pos]),250);
 }
}

async function pollScreenCommands(){
 try{
   const r=await db.from("screen_events")
     .select("id,host_id,gallery_id,event_type,created_at")
     .in("event_type",["screen_switch","screen_auto","gallery_full"])
     .order("id",{ascending:false})
     .limit(1)
     .maybeSingle();
   if(r.error)throw r.error;
   if(!r.data)return;
   const id=Number(r.data.id||0);
   if(!screenCommandSeeded||id>lastScreenEventId){
     screenCommandSeeded=true;lastScreenEventId=id;
     await applyScreenCommand(r.data);
   }
 }catch(e){
   console.error("远程投屏指令读取失败",e);
   $("status").textContent="远程控制读取异常";
 }
}
function applyLocalScreenCommand(cmd){
 if(cmd)applyScreenCommand({event_type:cmd.type,host_id:cmd.host_id});
}
if("BroadcastChannel" in window){
 const screenChannel=new BroadcastChannel("hui-zuan-screen");
 screenChannel.onmessage=e=>applyLocalScreenCommand(e.data);
}
window.addEventListener("storage",e=>{
 if(e.key==="hui_zuan_screen_command"&&e.newValue){
   try{applyLocalScreenCommand(JSON.parse(e.newValue))}catch(_){}
 }
});

function rotate(){if(screenLocked)return;if(entries.length>1&&!$("cg").classList.contains("show")&&!$("notice").classList.contains("show")){idx=(idx+1)%entries.length;renderCurrent()}}
window.addEventListener("pointerdown",()=>getAudioCtx(),{once:true});
loadAll().then(pollScreenCommands);rotator=setInterval(rotate,9000);setInterval(loadAll,1800);setInterval(pollScreenCommands,900);
</script>
