<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUI ZUAN｜待机站位管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f7fb;font-family:"Microsoft YaHei",Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px}.head{position:sticky;top:0;background:rgba(8,11,18,.96);backdrop-filter:blur(12px);padding:10px 0 16px;z-index:5}.brand{letter-spacing:5px;font-weight:800;font-size:19px}.sub{color:#9da8b9;margin-top:8px;font-size:13px}.list{display:grid;gap:8px;margin-top:14px}.item{display:grid;grid-template-columns:38px 54px 1fr 80px;align-items:center;gap:12px;padding:10px 12px;border:1px solid #2e3746;border-radius:14px;background:linear-gradient(180deg,#151b26,#0e131c);cursor:grab}.item.dragging{opacity:.38}.num{font:700 13px monospace;color:#9ca9bb}.item img{width:48px;height:58px;object-fit:contain;object-position:center bottom}.name{font-weight:800}.role{font-size:12px;color:#8996a8;text-align:right}.role.c{color:#fff;text-shadow:0 0 10px #fff}.actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,#080b12 28%)}button{flex:1;padding:12px;border-radius:12px;border:1px solid #465165;background:#182131;color:#fff;font-weight:800;cursor:pointer}button.primary{background:#e7edf7;color:#111827}.tip{margin-top:12px;padding:12px 14px;border:1px solid #273140;border-radius:12px;color:#aeb8c7;font-size:13px;line-height:1.7}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#edf3fb;color:#10151d;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
</style></head><body><div class="wrap"><div class="head"><div class="brand">HUI ZUAN · POSITION</div><div class="sub">拖曳人物修改待机站位。第 8 位为 C 位，尺寸与层级会自动跟着位置变化。</div></div><div id="list" class="list"></div><div class="tip">这里只修改待机画面的站位，不会修改人物图片、点歌资料或展馆资料。图片仍读取网站里的 <b>images/</b>。</div><div class="actions"><button onclick="resetOrder()">恢复预设</button><button class="primary" onclick="saveOrder()">保存站位</button></div></div><div id="toast" class="toast">已保存</div><script>
const KEY='huizuan_waiting_positions_v1';
const people={
'member-feiye':{name:'遇见',img:'images/yujian.png'},'member-kongbai':{name:'空白',img:'images/kongbai.png'},'member-zeyou':{name:'泽攸',img:'images/zeyou.png'},'member-qingjue':{name:'青决',img:'images/qingjue.png'},'member-yiyang':{name:'弋阳',img:'images/yiyang.png'},'member-fang':{name:'防',img:'images/fang.png'},'member-wu':{name:'雾',img:'images/wu.png'},'member-shayi':{name:'鲨熠',img:'images/shayi.png'},'member-qinian':{name:'祈年',img:'images/qinian.png'},'member-ai':{name:'艾',img:'images/ai.png'},'member-jinxun':{name:'宸御',img:'images/jinxun.png'},'member-beibei':{name:'北北',img:'images/beibei.png'},'member-lajiaoyou':{name:'辣椒油',img:'images/lajiaoyou.png'},'member-qibaiwan':{name:'七百万',img:'images/qibaiwan.png'}};
const DEFAULT=Object.keys(people);let order=[];let drag=null;
function valid(a){return Array.isArray(a)&&a.length===DEFAULT.length&&DEFAULT.every(x=>a.includes(x))}
function load(){try{let a=JSON.parse(localStorage.getItem(KEY)||'null');order=valid(a)?a:[...DEFAULT]}catch(e){order=[...DEFAULT]}render()}
function render(){const box=document.getElementById('list');box.innerHTML='';order.forEach((id,i)=>{const p=people[id],d=document.createElement('div');d.className='item';d.draggable=true;d.dataset.id=id;d.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')}</div><img src="${p.img}"><div class="name">${p.name}</div><div class="role ${i===7?'c':''}">${i===7?'◆ C 位':i===6||i===8?'C位侧翼':''}</div>`;d.ondragstart=()=>{drag=id;d.classList.add('dragging')};d.ondragend=()=>{drag=null;d.classList.remove('dragging')};d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(!drag||drag===id)return;const a=order.indexOf(drag),b=order.indexOf(id);order.splice(a,1);order.splice(b,0,drag);render()};box.appendChild(d)})}
function saveOrder(){localStorage.setItem(KEY,JSON.stringify(order));toast('站位已保存，投屏会即时更新')}
function resetOrder(){order=[...DEFAULT];render();localStorage.setItem(KEY,JSON.stringify(order));toast('已恢复预设站位')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}load();
</script></body></html>
