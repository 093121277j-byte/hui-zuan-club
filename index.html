<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>HUI ZUAN CLUB</title>


<style>

/* =========================================================
   01 基础
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    position: relative;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 50% 45%,
            #293243 0%,
            #121720 42%,
            #05070a 82%
        );

    transition:
        background 1s ease;
}


/* =========================================================
   02 左上角品牌
========================================================= */

.brand {
    position: absolute;

    top: 26px;
    left: 34px;

    z-index: 900;

    font-size: 21px;

    letter-spacing: 10px;

    text-shadow:
        0 0 20px
        rgba(230,240,255,.18);
}

.brand-small {
    margin-top: 7px;

    font-size: 8px;

    letter-spacing: 7px;

    opacity: .35;
}


/* =========================================================
   03 开启投屏
========================================================= */

.start-screen {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #293447 0%,
            #0d1119 56%,
            #040507 100%
        );
}

.start-card {
    width: 420px;

    padding: 60px 40px;

    text-align: center;
}

.start-diamond {
    position: relative;

    width: 66px;
    height: 66px;

    margin:
        0 auto 30px;

    transform:
        rotate(45deg);

    border:
        1px solid
        rgba(240,247,255,.72);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.20),
            rgba(125,150,195,.05)
        );

    box-shadow:
        0 0 45px
        rgba(220,235,255,.24),

        inset 0 0 25px
        rgba(255,255,255,.10);
}

.start-diamond::before {
    content: "";

    position: absolute;

    inset: 12px;

    border:
        1px solid
        rgba(255,255,255,.20);
}

.start-logo {
    font-size: 27px;

    letter-spacing: 10px;
}

.start-sub {
    margin-top: 11px;

    font-size: 9px;

    letter-spacing: 6px;

    opacity: .38;
}

.start-btn {
    margin-top: 34px;

    padding:
        13px 34px;

    border:
        1px solid
        rgba(255,255,255,.36);

    border-radius: 30px;

    background:
        rgba(255,255,255,.06);

    color: #ffffff;

    letter-spacing: 4px;

    cursor: pointer;

    transition:
        .25s ease;
}

.start-btn:hover {
    background:
        rgba(255,255,255,.14);

    box-shadow:
        0 0 25px
        rgba(225,238,255,.12);
}


/* =========================================================
   04 全员待机
========================================================= */

.waiting {
    position: absolute;

    inset: 0;

    z-index: 10;

    opacity: 1;

    visibility: visible;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

.waiting.hide {
    opacity: 0;

    visibility: hidden;
}


/* =========================================================
   05 待机背景
========================================================= */

.waiting-ring {
    position: absolute;

    left: 50%;
    top: 55%;

    width: 590px;
    height: 590px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(220,235,255,.10);

    box-shadow:
        0 0 100px
        rgba(215,230,255,.055);
}

.waiting-ring::before {
    content: "";

    position: absolute;

    inset: 38px;

    border-radius: 50%;

    border:
        1px solid
        rgba(220,235,255,.035);
}

.waiting-floor {
    position: absolute;

    left: 50%;
    bottom: -220px;

    width: 1200px;
    height: 450px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(215,230,255,.15),
            transparent 68%
        );

    filter:
        blur(26px);
}


/* =========================================================
   06 待机标题
========================================================= */

.waiting-title {
    position: absolute;

    top: 9%;

    left: 0;

    width: 100%;

    z-index: 300;

    text-align: center;
}

.waiting-en {
    font-size: 29px;

    letter-spacing: 13px;

    text-shadow:
        0 0 25px
        rgba(235,245,255,.20);
}

.waiting-cn {
    margin-top: 12px;

    font-size: 12px;

    letter-spacing: 8px;

    opacity: .52;
}

.waiting-small {
    margin-top: 9px;

    font-size: 8px;

    letter-spacing: 7px;

    opacity: .22;
}


/* =========================================================
   07 待机人物共用
========================================================= */

.member {
    position: absolute;

    bottom: -2%;

    display: flex;

    justify-content: center;
    align-items: flex-end;

    transform-origin:
        center bottom;

    animation:
        waitingFloat
        5s ease-in-out
        infinite;
}

.member img {
    position: relative;

    z-index: 10;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position:
        center bottom;

    filter:
        brightness(.88)
        drop-shadow(
            0 0 16px
            rgba(215,230,255,.16)
        );
}


/* =========================================================
   08 黑色布幕姓名系统
========================================================= */

.member-name {
    position: absolute;

    left: 50%;

    bottom:
        calc(100% - 24px);

    z-index: 800;

    display: flex;

    flex-direction: column;

    align-items: center;

    transform:
        translateX(-50%);

    pointer-events: none;
}


/* 姓名 */

.name-text {
    order: 1;

    position: relative;

    padding:
        0 5px 9px;

    color:
        rgba(245,249,255,.90);

    font-size: 10px;

    font-weight: 400;

    letter-spacing: 4px;

    white-space: nowrap;

    text-shadow:
        0 0 10px
        rgba(220,235,255,.55);
}


/* 姓名前的小钻 */

.name-text::before {
    content: "◇";

    display: inline-block;

    margin-right: 6px;

    font-size: 7px;

    color:
        rgba(230,240,255,.58);
}


/* =========================================================
   09 垂直姓名线
========================================================= */

.name-line {
    order: 2;

    position: relative;

    display: block;

    width: 1px;
    height: 62px;

    background:
        linear-gradient(
            to bottom,
            rgba(245,250,255,.92),
            rgba(220,235,255,.35),
            rgba(220,235,255,.05),
            transparent
        );

    box-shadow:
        0 0 7px
        rgba(220,235,255,.32);
}


/* 线顶部钻石节点 */

.name-line::before {
    content: "";

    position: absolute;

    left: -3px;
    top: -3px;

    width: 7px;
    height: 7px;

    transform:
        rotate(45deg);

    border:
        1px solid
        rgba(245,250,255,.76);

    background:
        rgba(225,240,255,.12);

    box-shadow:
        0 0 9px
        rgba(235,245,255,.58);
}


/* 线末端 */

.name-line::after {
    content: "";

    position: absolute;

    left: -1px;
    bottom: 0;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        rgba(235,245,255,.60);
}


/* =========================================================
   10 C位姓名
========================================================= */

.member-shayi .name-text {
    font-size: 12px;

    font-weight: 600;

    letter-spacing: 5px;

    color: #ffffff;

    text-shadow:
        0 0 14px
        rgba(240,248,255,.85);
}

.member-shayi .name-text::before {
    font-size: 9px;

    color:
        rgba(255,255,255,.92);
}

.member-shayi .name-line {
    height: 82px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,1),
            rgba(235,245,255,.48),
            rgba(220,235,255,.10),
            transparent
        );

    box-shadow:
        0 0 13px
        rgba(235,245,255,.52);
}


/* =========================================================
   11 人物浮动
========================================================= */

@keyframes waitingFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-4px);
    }

}


/* =========================================================
   12 十四人站位

   王权 空白 泽攸 青诀 弋阳 防 雾
                    鲨熠
   祈年 艾 锦洵 北北 辣椒油 七百万
========================================================= */

.member-feiye {
    left: -2.5%;

    width: 10%;

    height: 48%;

    z-index: 10;

    animation-delay:
        -.3s;
}


/* 02 空白 */

.member-kongbai {
    left: 4%;

    width: 10.5%;

    height: 52%;

    z-index: 12;

    animation-delay:
        -.8s;
}


/* 03 泽攸 */

.member-zeyou {
    left: 10.5%;

    width: 11%;

    height: 56%;

    z-index: 14;

    animation-delay:
        -1.3s;
}


/* 04 青诀 */

.member-qingjue {
    left: 17%;

    width: 11.5%;

    height: 60%;

    z-index: 17;

    animation-delay:
        -2.1s;
}


/* 05 弋阳 */

.member-yiyang {
    left: 23.5%;

    width: 12%;

    height: 64%;

    z-index: 22;

    animation-delay:
        -3s;
}


/* =========================================================
   06 防

========================================================= */

.member-fang {
    left: 30.3%;

    width: 11.5%;

    z-index: 31;

    animation-delay:
        -2.4s;
}

.member-fang img {
    filter:
        brightness(.97)
        drop-shadow(
            0 0 25px
            rgba(225,238,255,.25)
        );
}


/* =========================================================
   07 雾

========================================================= */

.member-wu {
    left: 37.1%;

    width: 12%;

    height: 73%;

    z-index: 40;

    animation-delay:
        -1.7s;
}

.member-wu img {
    filter:
        brightness(.98)
        drop-shadow(
            0 0 28px
            rgba(225,238,255,.28)
        );
}


/* =========================================================
   08 鲨熠
   唯一C位
========================================================= */

.member-shayi {
    left: 44%;

    width: 15%;

    height: 87%;

    z-index: 60;

    animation-delay:
        -.7s;
}

.member-shayi img {
    filter:
        brightness(1.07)
        drop-shadow(
            0 0 48px
            rgba(235,245,255,.46)
        );
}


/* =========================================================
   09 祈年
   鲨熠右副C
========================================================= */

.member-qinian {
    left: 53.5%;

    height: 73%;

    z-index: 41;

    animation-delay:
        -1.2s;
}

.member-qinian img {
    filter:
        brightness(.98)
        drop-shadow(
            0 0 28px
            rgba(225,238,255,.28)
        );
}


/* 10 艾 */

.member-ai {
    left: 60.8%;

    width: 11.5%;

    height: 68%;

    z-index: 30;

    animation-delay:
        -2.6s;
}


/* 11 锦洵 */

.member-jinxun {
    left: 67.8%;

    width: 11.5%;

    height: 64%;

    z-index: 24;

    animation-delay:
        -1.5s;
}


/* =========================================================
   12 北北
========================================================= */

.member-beibei {
    left: 74.8%;

    width: 11.5%;

    height: 60%;

    z-index: 26;

    animation-delay:
        -3.1s;
}

.member-beibei img {
    filter:
        brightness(.93)
        drop-shadow(
            0 0 21px
            rgba(220,235,255,.20)
        );
}


/* 13 辣椒油 */

.member-lajiaoyou {
    left: 81.8%;

}

.member-qibaiwan {
    left: 89%;

    width: 10.5%;

    height: 50%;

    z-index: 15;

    animation-delay:
        -1s;
}


/* =========================================================
   13 姓名错层

   名字全部在黑色布幕
   但高低错开避免打架
========================================================= */


/* 第一排 */

.member-feiye .member-name,
.member-zeyou .member-name,
.member-yiyang .member-name,
.member-wu .member-name,
.member-qinian .member-name,
.member-jinxun .member-name,
.member-lajiaoyou .member-name {

    transform:
        translateX(-50%)
        translateY(-28px);
}


/* 第二排 */

.member-kongbai .member-name,
.member-qingjue .member-name,
.member-fang .member-name,
.member-ai .member-name,
.member-beibei .member-name,
.member-qibaiwan .member-name {

    transform:
        translateX(-50%)
        translateY(8px);
}


/* C位最高 */

.member-shayi .member-name {

    transform:
        translateX(-50%)
        translateY(-58px);
}


/* =========================================================
   14 演唱模式
========================================================= */

.performance {
    position: absolute;

    inset: 0;

    z-index: 20;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

.performance.show {
    opacity: 1;

    visibility: visible;
}


/* =========================================================
   15 演唱人物
========================================================= */

.character-wrap {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 47%;
    height: 100%;

    z-index: 20;

    display: flex;

    justify-content: center;
    align-items: flex-end;
}

.character {
    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position:
        center bottom;

    transition:
        transform 1s ease,
        filter 1s ease,
        opacity .4s ease;
}

.character.enter {
    animation:
        characterEnter
        .9s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes characterEnter {

    0% {
        opacity: 0;

        transform:
            translateY(55px)
            scale(.87);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   16 珠宝舞台
========================================================= */

.gem-stage {
    position: absolute;

    left: 23%;
    top: 50%;

    width: 540px;
    height: 540px;

    transform:
        translate(-50%, -50%);

    z-index: 6;

    pointer-events: none;
}


/* =========================================================
   17 主钻石
========================================================= */

.main-diamond {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 255px;
    height: 255px;

    transform:
        translate(-50%, -50%);

    opacity: .18;

    clip-path:
        polygon(
            25% 8%,
            75% 8%,
            98% 34%,
            50% 95%,
            2% 34%
        );

    border:
        1px solid
        rgba(230,240,255,.22);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(115,145,190,.05) 30%,
            rgba(255,255,255,.14) 50%,
            rgba(100,125,175,.05) 72%,
            rgba(255,255,255,.11)
        );

    transition:
        all .9s ease;
}

.main-diamond::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            45deg,
            transparent 45%,
            rgba(255,255,255,.25) 49%,
            transparent 52%
        ),

        linear-gradient(
            -45deg,
            transparent 45%,
            rgba(255,255,255,.18) 49%,
            transparent 52%
        );
}


/* =========================================================
   18 钻石轨道
========================================================= */

.gem-orbit {
    position: absolute;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    opacity: 0;

    transition:
        opacity .8s ease;
}

.orbit-one {
    width: 365px;
    height: 365px;

    border:
        1px solid
        rgba(235,243,255,.34);

    transform:
        translate(-50%, -50%);
}

.orbit-two {
    width: 445px;
    height: 270px;

    border:
        1px solid
        rgba(235,243,255,.25);

    transform:
        translate(-50%, -50%)
        rotate(-16deg);
}

.orbit-three {
    width: 475px;
    height: 320px;

    border:
        1px solid
        rgba(235,243,255,.18);

    transform:
        translate(-50%, -50%)
        rotate(18deg);
}


/* =========================================================
   19 灰钻皇冠
========================================================= */

.jewel-crown {
    position: absolute;

    left: 50%;
    top: 2%;

    width: 190px;
    height: 90px;

    transform:
        translateX(-50%);

    opacity: 0;

    transition:
        opacity .8s ease;
}

.jewel-crown::before {
    content: "";

    position: absolute;

    left: 20px;
    bottom: 7px;

    width: 150px;
    height: 52px;

    clip-path:
        polygon(
            0% 100%,
            8% 38%,
            30% 72%,
            50% 0%,
            70% 72%,
            92% 38%,
            100% 100%
        );

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            rgba(245,248,255,.88),
            rgba(140,165,210,.24),
            rgba(255,255,255,.76)
        );

    filter:
        drop-shadow(
            0 0 17px
            rgba(235,245,255,.60)
        );
}

.jewel-crown::after {
    content: "";

    position: absolute;

    left: 86px;
    top: 3px;

    width: 18px;
    height: 18px;

    transform:
        rotate(45deg);

    background:
        rgba(255,255,255,.95);

    box-shadow:
        0 0 14px #ffffff,
        0 0 35px
        rgba(210,230,255,.70);
}


/* =========================================================
   20 珠宝垂链
========================================================= */

.jewel-chain {
    position: absolute;

    top: 17%;
    bottom: 11%;

    width: 1px;

    opacity: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(240,246,255,.70) 0,
            rgba(240,246,255,.70) 3px,
            transparent 3px,
            transparent 9px
        );

    transition:
        opacity .8s ease;
}

.chain-left {
    left: 11%;
}

.chain-right {
    right: 11%;
}

.jewel-chain::before,
.jewel-chain::after {
    content: "";

    position: absolute;

    left: -4px;

    width: 9px;
    height: 9px;

    transform:
        rotate(45deg);

    background:
        rgba(248,251,255,.92);

    box-shadow:
        0 0 11px
        rgba(230,243,255,.75);
}

.jewel-chain::before {
    top: 28%;
}

.jewel-chain::after {
    top: 68%;
}


/* =========================================================
   21 晶体
========================================================= */

.crystal {
    position: absolute;

    width: 15px;
    height: 30px;

    opacity: 0;

    clip-path:
        polygon(
            50% 0%,
            100% 40%,
            70% 100%,
            30% 100%,
            0% 40%
        );

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.98),
            rgba(145,175,225,.25)
        );

    filter:
        drop-shadow(
            0 0 8px
            rgba(225,240,255,.60)
        );

    transition:
        opacity .8s ease;
}

.crystal-1 {
    left: 7%;
    top: 31%;

    transform:
        rotate(-35deg);
}

.crystal-2 {
    left: 15%;
    top: 69%;

    transform:
        rotate(25deg);
}

.crystal-3 {
    right: 8%;
    top: 34%;

    transform:
        rotate(30deg);
}

.crystal-4 {
    right: 16%;
    top: 72%;

    transform:
        rotate(-20deg);
}


/* =========================================================
   22 聚光灯
========================================================= */

.spotlight {
    position: absolute;

    left: 4%;
    top: -30%;

    width: 40%;
    height: 130%;

    transform:
        rotate(7deg);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.30),
            transparent 70%
        );

    filter:
        blur(45px);

    opacity: 0;

    transition:
        opacity 1s ease;

    z-index: 4;
}


/* =========================================================
   23 粒子
========================================================= */

.particles {
    position: absolute;

    inset: 0;

    z-index: 12;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .8s ease;
}

.particle {
    position: absolute;

    width: 5px;
    height: 5px;

    transform:
        rotate(45deg);

    background:
        #ffffff;

    box-shadow:
        0 0 12px
        rgba(230,240,255,.8);

    animation:
        particleMove
        6s linear
        infinite;
}

.particle:nth-child(1) {
    left: 8%;
    top: 75%;
}

.particle:nth-child(2) {
    left: 15%;
    top: 55%;

    animation-delay: 1s;
}

.particle:nth-child(3) {
    left: 25%;
    top: 82%;

    animation-delay: 2s;
}

.particle:nth-child(4) {
    left: 34%;
    top: 63%;

    animation-delay: 3s;
}

.particle:nth-child(5) {
    left: 42%;
    top: 78%;

    animation-delay: 4s;
}

.particle:nth-child(6) {
    left: 30%;
    top: 35%;

    animation-delay: 5s;
}

.particle:nth-child(7) {
    left: 20%;
    top: 25%;

    animation-delay: 2.6s;
}

.particle:nth-child(8) {
    left: 39%;
    top: 45%;

    animation-delay: 4.4s;
}

@keyframes particleMove {

    0% {
        transform:
            translateY(100px)
            rotate(45deg);

        opacity: 0;
    }

    25% {
        opacity: .85;
    }

    100% {
        transform:
            translateY(-420px)
            rotate(225deg);

        opacity: 0;
    }

}


/* =========================================================

   30 舞台动画
========================================================= */

@keyframes orbitSpin {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }

}

@keyframes orbitSpinReverse {

    from {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

}

@keyframes diamondBreath {

    0%,
    100% {
        filter:
            brightness(1);
    }

    50% {
        filter:
            brightness(1.38);
    }

}

@keyframes crystalGlow {

    0%,
    100% {
        filter:
            brightness(.9)
            drop-shadow(
                0 0 6px
                rgba(220,235,255,.45)
            );
    }

    50% {
        filter:
            brightness(1.55)
            drop-shadow(
                0 0 18px
                rgba(240,248,255,.94)
            );
    }

}

   31 升级动画
========================================================= */

.upgrade {
    position: fixed;

    inset: 0;

    z-index: 1500;

    display: flex;

    justify-content: center;
    align-items: center;

    opacity: 0;

    pointer-events: none;
}

.upgrade.play {
    animation:
        upgradeFade
        3s ease;
}

.upgrade-light {
    position: absolute;

    width: 680px;
    height: 680px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.36),
            rgba(200,225,255,.12) 30%,
            transparent 68%
        );

    filter:
        blur(10px);
}

.upgrade-orbit {
    position: absolute;

    width: 360px;
    height: 360px;

    border-radius: 50%;

    border:
        1px solid
        rgba(240,247,255,.44);

    animation:
        upgradeOrbit
        3s linear
        infinite;
}

.upgrade-orbit::before,
.upgrade-orbit::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 11px;

    transform:
        rotate(45deg);

    background:
        #ffffff;

    box-shadow:
        0 0 16px
        rgba(255,255,255,.95);
}

.upgrade-orbit::before {
    left: 35px;

    top: 55px;
}

.upgrade-orbit::after {
    right: 35px;

    bottom: 55px;
}

========================================================= */

    position: relative;

    width: 280px;
    height: 220px;

    display: flex;

    justify-content: center;
    align-items: center;

    clip-path:
        polygon(
            24% 7%,
            76% 7%,
            98% 35%,
            50% 96%,
            2% 35%
        );

        linear-gradient(
            135deg,
            rgba(255,255,255,.34),
            rgba(130,160,210,.10),
            rgba(255,255,255,.34)

    box-shadow:
        0 0 35px
        rgba(255,255,255,.58),

        0 0 115px
        rgba(210,235,255,.60),

        inset 0 0 55px
        rgba(255,255,255,.23);
}

.upgrade-diamond::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 34%;

    height: 1px;

    background:
        rgba(255,255,255,.38);

    box-shadow:
        0 0 8px
        rgba(255,255,255,.30);

.upgrade-diamond::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 7%;

    width: 1px;
    height: 89%;

            rgba(255,255,255,.32),

@keyframes upgradeFade {

    0% {
        opacity: 0;

        transform:
            scale(.48);
    }

    15% {
        opacity: 1;

        transform:
            scale(1.08);
    }

    35% {
        transform:
            scale(1);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            scale(1.18);

<script>

/* =========================================================
   AUDIO
========================================================= */

let audioEnabled = false;

let audioContext = null;

let lastLevel = null;

let lastMode = null;


/* =========================================================
   开启投屏
========================================================= */

function enableStage() {

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    audioEnabled = true;


    document
        .getElementById(
            "startScreen"
        )
        .style.display =
        "none";


    updateDisplay(true);

}


/* =========================================================
   基础声音
========================================================= */

function tone(
    frequency,
    start,
    duration,
    volume,
    type = "sine"
) {

    if (
        !audioEnabled ||
        !audioContext
    ) {

        return;

    }


    const osc =
        audioContext
            .createOscillator();


    const gain =
        audioContext
            .createGain();


    const now =
        audioContext.currentTime;


    osc.type =
        type;


    osc.frequency.value =
        frequency;


    gain.gain
        .setValueAtTime(
            .0001,
            now + start
        );


    gain.gain
        .exponentialRampToValueAtTime(
            volume,
            now + start + .02
        );


    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            now + start + duration
        );


    osc.connect(
        gain
    );


    gain.connect(
        audioContext.destination
    );


    osc.start(
        now + start
    );


    osc.stop(
        now +
        start +
        duration +
        .05
    );

}


/* =========================================================
   登场音效
========================================================= */

function playEntrance() {

    tone(
        220,
        0,
        .35,
        .08
    );


    tone(
        440,
        .16,
        .45,
        .07
    );


    tone(
        880,
        .34,
        .55,
        .055
    );

}


/* =========================================================
   待机音效
========================================================= */

function playWaiting() {

    tone(
        520,
        0,
        .28,
        .035
    );


    tone(
        390,
        .18,
        .38,
        .025
    );

}


/* =========================================================
   高级舞台音效
========================================================= */

function playLevel1() {

    tone(
        523,
        0,
        .32,
        .055
    );


    tone(
        659,
        .15,
        .35,
        .055
    );


    tone(
        784,
        .30,
        .50,
        .06
    );

}


/* =========================================================
   高光舞台音效
========================================================= */

function playLevel2() {

    tone(
        392,
        0,
        .32,
        .065
    );


    tone(
        523,
        .10,
        .40,
        .07
    );


    tone(
        659,
        .23,
        .45,
        .075
    );


    tone(
        1046,
        .42,
        .65,
        .06
    );

}


/* =========================================================
   灰钻舞台音效
========================================================= */

function playLevel3() {

    tone(
        196,
        0,
        .55,
        .08,
        "triangle"
    );


    tone(
        392,
        .08,
        .55,
        .075
    );


    tone(
        523,
        .20,
        .65,
        .08
    );


    tone(
        784,
        .38,
        .75,
        .08
    );


    tone(
        1046,
        .58,
        .95,
        .07
    );


    tone(
        1568,
        .85,
        1.1,
        .04
    );

}


/* =========================================================
   读取资料
========================================================= */

function getData() {

    return (

        JSON.parse(

            localStorage.getItem(
                "huizuanData"
            )

        )

        ||

        {

            mode:
                "waiting",

            singer:
                "鲨熠",

            song:
                "",

            requester:
                "",

            heart:
                0,

            character:
                "images/shayi.png",

            eventId:
                0

        }

    );

}


/* =========================================================
   判断等级
========================================================= */

function getLevel(value) {

    if (
        value >= 10000
    ) {

        return 3;

    }


    if (
        value >= 5000
    ) {

        return 2;

    }


    if (
        value >= 1000
    ) {

        return 1;

    }


    return 0;

}


/* =========================================================
   更新投屏
========================================================= */


/* ===== 全麦试音音频 ===== */
let auditionAudio = null;
let lastAuditionEventId = null;
function stopAuditionAudio(){ if(auditionAudio){ auditionAudio.pause(); auditionAudio.currentTime=0; auditionAudio=null; } }
function playAuditionAudio(data){
  stopAuditionAudio();
  if(!data.voice){ document.getElementById("auditionStatus").innerText="试音音频待上传"; return; }
  auditionAudio=new Audio(data.voice);
  auditionAudio.play().then(()=>{document.getElementById("auditionStatus").innerText="正在试听";}).catch(()=>{document.getElementById("auditionStatus").innerText="请先点击开启投屏";});
}

function updateDisplay(
    initial = false
) {

    const data =
        getData();


    const mode =
        data.mode ||
        "waiting";


    const heartValue =
        Number(
            data.heart
        ) || 0;


    const level =
        getLevel(
            heartValue
        );

    /* 全麦试音独立模式 */
    const auditionEl=document.getElementById("audition");
    if(mode === "audition"){
        document.getElementById("waiting").classList.add("hide");
        document.getElementById("performance").classList.remove("show");
        auditionEl.classList.add("show");
        document.getElementById("auditionCharacter").src=data.character || "";
        document.getElementById("auditionName").innerText=data.singer || "";
        if(!initial && lastAuditionEventId !== data.eventId){ lastAuditionEventId=data.eventId; playAuditionAudio(data); }
        lastMode="audition"; lastLevel=null; return;
    }
    auditionEl.classList.remove("show");
    if(lastMode === "audition") stopAuditionAudio();


    /* =====================================================
       全员待机
    ===================================================== */

    if (
        mode ===
        "waiting"
    ) {


        document
            .getElementById(
                "waiting"
            )
            .classList
            .remove(
                "hide"
            );


        document
            .getElementById(
                "performance"
            )
            .classList
            .remove(
                "show"
            );


        if (
            !initial &&
            lastMode ===
            "performance"
        ) {

            playWaiting();

        }


        lastMode =
            "waiting";


        lastLevel =
            null;


        return;

    }


    /* =====================================================
       演唱模式
    ===================================================== */

    document
        .getElementById(
            "waiting"
        )
        .classList
        .add(
            "hide"
        );


    document
        .getElementById(
            "performance"
        )
        .classList
        .add(
            "show"
        );


    /* =====================================================
       登场
    ===================================================== */

    if (
        !initial &&
        lastMode !==
        "performance"
    ) {


        playEntrance();


        const character =
            document
                .getElementById(
                    "character"
                );


        character
            .classList
            .remove(
                "enter"
            );


        void character.offsetWidth;


        character
            .classList
            .add(
                "enter"
            );

    }


    /* =====================================================
       更新人物
    ===================================================== */

    document
        .getElementById(
            "character"
        )
        .src =

        data.character ||
        "images/shayi.png";


    /* =====================================================
       更新歌手
    ===================================================== */

    document
        .getElementById(
            "singer"
        )
        .innerText =

        data.singer ||
        "—";


    /* =====================================================
       更新歌曲
    ===================================================== */

    document
        .getElementById(
            "song"
        )
        .innerText =

        "《" +

        (
            data.song ||
            "等待点歌"
        )

        +

        "》";


    /* =====================================================
       更新点歌人
    ===================================================== */

    document
        .getElementById(
            "requester"
        )
        .innerText =

        "点歌人 · " +

        (
            data.requester ||
            "—"
        );


    /* =====================================================
       更新心动值
    ===================================================== */

    document
        .getElementById(
            "heart"
        )
        .innerText =

        "♡ " +

        heartValue
            .toLocaleString();


    /* =====================================================
       清除旧等级
    ===================================================== */

    document.body
        .classList
        .remove(
            "level0",
            "level1",
            "level2",
            "level3"
        );


    /* =====================================================
       套用新等级
    ===================================================== */

    document.body
        .classList
        .add(
            "level" +
            level
        );


    let stageName =
        "◇ 基础舞台";


    let start =
        0;


    let end =
        1000;


    let progress =
        0;


    let nextText =
        "";


    /* =====================================================
       LEVEL 0
       0 - 999
    ===================================================== */

    if (
        level === 0
    ) {


        stageName =
            "◇ 基础舞台";


        start =
            0;


        end =
            1000;


        progress =

            heartValue /
            1000 *
            100;


        nextText =

            "距高级舞台还差 ♡" +

            (
                1000 -
                heartValue
            )
            .toLocaleString();

    }


    /* =====================================================
       LEVEL 1
       1000 - 4999
    ===================================================== */

    if (
        level === 1
    ) {


        stageName =
            "◇ ✦ 高级舞台";


        start =
            1000;


        end =
            5000;


        progress =

            (
                heartValue -
                1000
            )

            /

            4000

            *

            100;


        nextText =

            "距高光舞台还差 ♡" +

            (
                5000 -
                heartValue
            )
            .toLocaleString();

    }


    /* =====================================================
       LEVEL 2
       5000 - 9999
    ===================================================== */

    if (
        level === 2
    ) {


        stageName =
            "◇ ✦✦ 高光舞台";


        start =
            5000;


        end =
            10000;


        progress =

            (
                heartValue -
                5000
            )

            /

            5000

            *

            100;


        nextText =

            "距灰钻舞台还差 ♡" +

            (
                10000 -
                heartValue
            )
            .toLocaleString();

    }


    /* =====================================================
       LEVEL 3
       10000+
    ===================================================== */

    if (
        level === 3
    ) {


        stageName =
            "♢ ✦ 灰钻舞台 ✦ ♢";


        start =
            10000;


        end =
            "MAX";


        progress =
            100;


        nextText =
            "HUI ZUAN · MAX";

    }


    /* =====================================================
       限制进度
    ===================================================== */

    progress =
        Math.max(

            0,

            Math.min(
                100,
                progress
            )

        );


    /* =====================================================
       更新舞台名称
    ===================================================== */

    document
        .getElementById(
            "stageName"
        )
        .innerText =
        stageName;


    /* =====================================================
       更新范围
    ===================================================== */

    document
        .getElementById(
            "rangeStart"
        )
        .innerText =

        Number(
            start
        )
        .toLocaleString();


    document
        .getElementById(
            "rangeEnd"
        )
        .innerText =

        typeof end ===
        "number"

        ?

        end.toLocaleString()

        :

        end;


    /* =====================================================
       更新进度条
    ===================================================== */

    document
        .getElementById(
            "progress"
        )
        .style.width =

        progress +
        "%";


    /* =====================================================
       更新下一级
    ===================================================== */

    document
        .getElementById(
            "nextStage"
        )
        .innerText =
        nextText;


    /* =====================================================
       真正跨级才播放动画
    ===================================================== */

    if (
        lastLevel !== null &&
        level > lastLevel
    ) {


        if (
            level === 1
        ) {

            showUpgrade(
                "高级舞台"
            );


            playLevel1();

        }


        if (
            level === 2
        ) {

            showUpgrade(
                "高光舞台"
            );


            playLevel2();

        }


        if (
            level === 3
        ) {

            showUpgrade(
                "灰钻舞台"
            );


            playLevel3();

        }

    }


    lastLevel =
        level;


    lastMode =
        "performance";

}


/* =========================================================
   升级动画
========================================================= */

function showUpgrade(text) {

    const upgrade =
        document
            .getElementById(
                "upgrade"
            );


    document
        .getElementById(
            "upgradeText"
        )
        .innerText =
        text;


    upgrade
        .classList
        .remove(
            "play"
        );


    void upgrade.offsetWidth;


    upgrade
        .classList
        .add(
            "play"
        );

}


/* =========================================================
   control.html 同步
========================================================= */

window.addEventListener(

    "storage",

    function(event) {


        if (
            event.key ===
            "huizuanData"
        ) {

            updateDisplay(
                false
            );

        }

    }

);


/* =========================================================
   第一次载入
========================================================= */

updateDisplay(
    true
);

</script>
