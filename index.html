<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUI ZUAN CLUB｜一体式投屏</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070a;transition:opacity .35s ease,visibility .35s ease}.off{opacity:0;visibility:hidden;pointer-events:none}.on{opacity:1;visibility:visible;pointer-events:auto}</style></head><body><iframe id="song" src="song-screen.html" class="on" allow="autoplay"></iframe><iframe id="gallery" src="gallery-screen.html" class="off" allow="autoplay"></iframe><script>
const db=supabase.createClient("https://ossaeaswzzfrekguefkh.supabase.co","sb_publishable_xxEoSgJZGaNrLmJnr1gtng_Xoxnd_Nn");
let baseMode=localStorage.getItem('huizuan_unified_mode')||'waiting', interrupt=false,lastId=0,seeded=false;
function show(mode){baseMode=mode;localStorage.setItem('huizuan_unified_mode',mode);render()}
function render(){const g=document.getElementById('gallery'),s=document.getElementById('song');const useGallery=interrupt||baseMode==='gallery';g.className=useGallery?'on':'off';s.className=useGallery?'off':'on';if(baseMode==='waiting'&&!interrupt){try{const d=JSON.parse(localStorage.getItem('huizuanData')||'{}');if(d.mode!=='waiting'){d.mode='waiting';d.eventId=Date.now();localStorage.setItem('huizuanData',JSON.stringify(d))}}catch(e){}}}
window.addEventListener('storage',e=>{if(e.key==='huizuan_unified_mode'&&e.newValue){baseMode=e.newValue;render()}if(e.key==='huizuanData'&&e.newValue&&!interrupt){try{const d=JSON.parse(e.newValue);if(d.mode==='performance'&&baseMode!=='gallery'){baseMode='song';localStorage.setItem('huizuan_unified_mode','song')}else if(d.mode==='waiting'&&baseMode!=='gallery'){baseMode='waiting';localStorage.setItem('huizuan_unified_mode','waiting')}render()}catch(_){}}});
async function poll(){try{const r=await db.from('screen_events').select('id,event_type,created_at').in('event_type',['unified_waiting','unified_song','unified_gallery','gallery_full']).order('id',{ascending:false}).limit(1).maybeSingle();if(r.error||!r.data)return;const id=Number(r.data.id||0);if(!seeded){seeded=true;lastId=id;return}if(id<=lastId)return;lastId=id;const t=r.data.event_type;if(t==='unified_waiting')show('waiting');if(t==='unified_song')show('song');if(t==='unified_gallery')show('gallery');if(t==='gallery_full'){interrupt=true;render();setTimeout(()=>{interrupt=false;render()},7600)}}catch(e){console.error(e)}}
render();setInterval(poll,700);poll();</script></body></html>
